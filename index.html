<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/box-select.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Porosh Islam Tarek | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: "var(--neo-border-color)",
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --neo-border-color: #000000;
        --neo-shadow-color: #000000;
        --neo-bg-light: #E0E7FF;
        --neo-bg-dark: #0f172a;
        
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      .dark {
        --neo-border-color: #ffffff;
        --neo-shadow-color: #000000; /* Keep shadow black for depth */
      }
      
      html, body {
        overscroll-behavior: none; /* Prevents rubber-banding on mobile */
        touch-action: pan-x pan-y; /* Improves touch handling */
        -webkit-tap-highlight-color: transparent; /* Removes grey tap box */
        height: 100%;
        width: 100%;
        position: fixed; /* Prevents body scroll */
      }
      
      body {
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
        user-select: none;
        background-color: var(--neo-bg-light);
        color: #000;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .dark body {
        background-color: var(--neo-bg-dark);
        color: #fff;
      }

      /* Custom Scrollbar - Adaptive */
      ::-webkit-scrollbar {
        width: 16px;
        height: 16px;
      }
      ::-webkit-scrollbar-track {
        background: #fff;
        border-left: 3px solid var(--neo-border-color);
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #000;
        border: 3px solid #fff;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #fff;
        border: 3px solid #1e293b;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #444;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Neo-Brutalist Utilities */
      .neo-border {
        border: 3px solid var(--neo-border-color);
      }
      .neo-border-sm {
        border: 2px solid var(--neo-border-color);
      }
      
      /* Utilities that auto-adapt via Tailwind config mostly, but helpers here */
      .neo-shadow {
        box-shadow: 4px 4px 0px 0px var(--neo-shadow-color);
      }
      .neo-shadow-lg {
        box-shadow: 8px 8px 0px 0px var(--neo-shadow-color);
      }
      .neo-shadow-active:active {
        box-shadow: 2px 2px 0px 0px var(--neo-shadow-color);
        transform: translate(2px, 2px);
      }

      /* Specific utility for image pixelation */
      .image-pixelated {
        image-rendering: pixelated;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "zustand": "https://esm.sh/zustand@^5.0.9",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-rnd": "https://esm.sh/react-rnd@^10.5.2",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "three": "https://esm.sh/three@0.161.0",
    "three/addons/": "https://esm.sh/three@0.161.0/examples/jsm/",
    "three/": "https://esm.sh/three@^0.182.0/",
    "lottie-react": "https://esm.sh/lottie-react@^2.4.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?bundle",
    "@emailjs/browser": "https://esm.sh/@emailjs/browser@3.11.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
